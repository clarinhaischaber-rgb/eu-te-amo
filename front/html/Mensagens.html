    <link rel="stylesheet" href="../css/mensagens.css">
    <script src="../js/global.js" defer></script>
    <script src="../js/carta.js" defer></script>
</head>
<body class="resource-theme">
    <header class="site-header">
        <nav class="navbar" aria-label="Navegação principal">
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu"><span></span><span></span><span></span><span class="sr-only">Abrir menu</span></button>
            <div class="nav-menu" id="main-menu">
                <a class="nav-link" href="Nos.html">Nós</a>
                <a class="nav-link" href="Joestar.html">Joestar</a>
                <a class="nav-link" href="Caosinha.html">Caosinha</a>

                <a class="nav-link" href="Codigos.html">Códigos</a>

                <a class="nav-link " href="Conta.html">Conta</a>
            </div>
        </nav>
    </header>
    <main class="resource-page">
        <p class="eyebrow">Um cantinho para guardar carinho</p>
        <h1>Mensagens</h1>
        <p class="resource-intro">Aqui ficarão as cartas permanentes e as mensagens surpresa do biscoito da sorte.</p>
        <div class="resource-grid">
            <article class="resource-card carta-card">
                <span class="card-number">01</span>
                <h2>Cartas</h2>
                <form id="carta-form" class="carta-form">
                    <label>Destinatário<input id="carta-destinatario" name="destinatario" required></label>
                    <label>Data<input id="carta-data" name="data" type="date" required></label>
                    <label>Texto<textarea id="carta-text" name="text" rows="5" required></textarea></label>
                    <div class="carta-form-row">
                        <label>Cor da carta<select id="carta-cor-carta" name="corCarta" required></select></label>
                        <label>Cor da letra<select id="carta-cor-letra" name="corLetra" required></select></label>
                    </div>
                    <label>Fonte<select id="carta-fonte" name="fonte" required></select></label>
                    <button type="submit" class="carta-submit">Guardar carta</button>
                    <p id="carta-status" class="carta-status" role="status"></p>
                </form>
                <div id="cartas-lista" class="cartas-lista" aria-live="polite"></div>
            </article>
            <article class="resource-card"><span class="card-number">02</span><h2>Biscoito da sorte</h2><p>Uma surpresa diferente para cada momento.</p><span class="placeholder-label">Em breve</span></article>
        </div>
    </main>
</body>
</html>
