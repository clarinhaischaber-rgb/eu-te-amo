<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joestar</title>
    <link rel="stylesheet" href="../css/home.css">
    <script src="../js/home.js" defer></script>
    <script src="../js/JoestarGame.js" defer></script>
</head>

<body class="joestar-theme">
    <header class="site-header">
        <nav class="navbar" aria-label="Navegação principal">
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
                <span></span><span></span><span></span>
                <span class="sr-only">Abrir menu</span>
            </button>
            <div class="nav-menu" id="main-menu">
                <a class="nav-link" href="Nos.html">Nós</a>
                <a class="nav-link active" href="Joestar.html">Joestar</a>
                <a class="nav-link" href="Caosinha.html">Caosinha</a>
                <a class="nav-link" href="Mensagens.html">Mensagens</a>
                <a class="nav-link" href="Codigos.html">Códigos</a>
                <a class="nav-link" href="Desenhos.html">Desenhos</a>
                <a class="nav-link" href="Momentos.html">Momentos</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="photo-section single-page-section">
            <div class="photo-frame" aria-label="Foto do Joestar">
                <img src="../../img/Joestar.jpg" alt="Foto do Joestar">
            </div>
            <div class="photo-copy">
                <h1>Joestar</h1>
            </div>
        </section>
        <section class="about-section" id="sobre-mim">
            <h2>Sobre mim</h2>
            <p>Joestar é uma presença especial, cheia de personalidade, carinho e momentos que tornam os nossos dias
                mais divertidos.</p>
        </section>
        <!-- AQUI FICA A TELA DO JOGO -->
        <section class="game-section" id="jogo">
            <h2>Minigame do Joestar</h2>
            <div class="game-wrapper" id="gameWrapper">
                <div class="game-start-overlay" id="gameStartOverlay">
                    <button type="button" id="btnStartGame" class="game-start-btn">Iniciar jogo</button>
                    <button type="button" id="btnReturnFullscreen" class="game-start-btn return-fullscreen-btn">Voltar para tela cheia</button>
                </div>
                <!-- BARRA DE FERRAMENTAS DO JOGO -->
                <div class="game-toolbar">
                    <button type="button" id="btnFullscreen" class="game-btn game-btn-fullscreen" title="Sair da tela cheia" aria-label="Sair da tela cheia">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 3H5a2 2 0 0 0-2 2v4m12-6h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4m12 6h4a2 2 0 0 0 2-2v-4"/>
                        </svg>
                        <span>Sair da tela</span>
                    </button>
                    <button type="button" id="btnPause" class="game-btn game-btn-pause" title="Pausar Jogo" aria-label="Pausar Jogo">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16"/>
                            <rect x="14" y="4" width="4" height="16"/>
                        </svg>
                        <span>Pausar</span>
                    </button>
                    <button type="button" id="btnRestart" class="game-btn game-btn-restart" title="Reiniciar Jogo" aria-label="Reiniciar Jogo">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 4v6h6M23 20v-6h-6"/>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                        </svg>
                        <span>Reiniciar</span>
                    </button>
                </div>

                <div class="game-container">
                    <!-- A tag canvas cria a janela/tela 2D onde o jogo acontece -->
                    <canvas id="gameCanvas" width="800" height="400"></canvas>
                </div>

                <!-- CONTROLES MOBILE / TOUCH -->
                <div class="mobile-controls" id="mobileControls">
                    <!-- MOVIMENTAÇÃO (D-PAD) -->
                    <div class="mobile-group mobile-dpad">
                        <button type="button" class="touch-btn touch-btn-jump" id="btnJump" aria-label="Pular">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
                                <path d="M12 4l-7 7 1.41 1.41L11 7.83V20h2V7.83l4.59 4.58L19 11z"/>
                            </svg>
                        </button>
                        <button type="button" class="touch-btn touch-btn-dir" id="btnLeft" aria-label="Mover para esquerda">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                            </svg>
                        </button>
                        <button type="button" class="touch-btn touch-btn-dir" id="btnRight" aria-label="Mover para direita">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- AÇÕES E COMBATE -->
                    <div class="mobile-group mobile-actions">
                        <button type="button" class="touch-btn touch-btn-block" id="btnBlock" aria-label="Bloqueio ou Parry">
                            <span>PARRY</span>
                        </button>
                        <button type="button" class="touch-btn touch-btn-attack" id="btnAttack" aria-label="Golpe">
                            <span>GOLPE</span>
                        </button>
                        <button type="button" class="touch-btn touch-btn-ult" id="btnUlt" aria-label="Ultimate">
                            <span>ULT</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
</html>
