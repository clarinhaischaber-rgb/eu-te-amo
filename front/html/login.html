<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/global.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>
<body class="resource-theme">
    <header class="site-header">
        <nav class="navbar" aria-label="Navegação principal">
            <div class="brand">NOSSO<span>ESPAÇO</span></div>
        </nav>
    </header>

    <main class="login-page">
        <div class="login-card">
            <div class="login-header">
                <p class="eyebrow">Acesso Restrito</p>
                <h1>Entrar</h1>
                <p>Acesse com sua conta para gerenciar publicações e memórias.</p>
            </div>

            <form id="login-form" class="login-form">
                <label for="email">
                    E-mail
                    <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="email">
                </label>

                <label for="password">
                    Senha
                    <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                </label>

                <button type="submit" class="login-submit-btn">Entrar</button>
            </form>

            <div class="login-divider">
                <span>ou</span>
            </div>

            <button type="button" id="visitor-btn" class="visitor-btn">
                Entrar como Visitante
            </button>
        </div>
    </main>
</body>
</html>
